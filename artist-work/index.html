<div class="content"><div class="page"><div class="page-content"><bodycopy><div class="column-set"><div class="column-unit" style="--span:12"> <h1> <a href="/">Natalia Gima<br> <br></a></h1><h2>Projects <a class="back" href="/"><span style="--font-scale: 0.49;">← Back to Home</span></a> </h2> <br></div></div><div class="gallery-grid" style="--cols:2"><figure class="mi"><a class="ml" href="/o-i/"><img src="/img/J2777593329126331098113635646062.webp" width="768" height="1024" alt="" fetchpriority="high" decoding="async"></a><figcaption class="caption">O.I “Organic Intelligence” Live A/V with Jokkoo Collective, 2025, Atonal Berlín.</figcaption></figure><figure class="mi"><a class="ml" href="/aural/"><img src="/img/A2777595952991208142560257505902.webp" width="900" height="505" alt="" loading="lazy" decoding="async"></a><figcaption class="caption"> “Aural” an interactive installation that transforms light into sound through the movement of the body with Akyute, 2019</figcaption></figure><figure class="mi"><a class="ml" href="/mirror-mirror/"><img src="/img/N2777610786774434319432803547758.webp" width="750" height="977" alt="" loading="lazy" decoding="async"></a><figcaption class="caption">“Mirror Mirror” An exploration of co-agency between plants and humans, where biodata shapes shifting, mirror-like audiovisual reflections.</figcaption></figure><figure class="mi"><a class="ml" href="/paisaje-sonoro/"><img src="/img/Z2777614341222209650305175779950.webp" width="2400" height="1796" alt="" loading="lazy" decoding="async"></a><figcaption class="caption"> “Paisaje Sonoro” An interactive audiovisual performance where plant signals generate live sound and visuals, exploring the entanglement of body, technology, and environment.<br> </figcaption></figure></div><div class="column-set"><div class="column-unit" style="--span:12"><div class="gallery-grid" style="--cols:2"><figure class="mi"><a class="ml" href="/time-force-space/"><img src="/img/S2777655841009926227273122708078.webp" width="2400" height="1796" alt="" loading="lazy" decoding="async"></a><figcaption class="caption">“Time Force &#x26; Space” An ongoing investigation into how digital systems interpret the body, using performance to challenge the boundaries between human, machine, and environment. <br> </figcaption></figure><figure class="mi"><a class="ml" href="/holocausto-de-oxígeno/"><img src="/img/P2777608395541446788537337117294.webp" width="1920" height="1080" alt="" loading="lazy" decoding="async"></a><figcaption class="caption"> “Holocausto de oxígeno” An ongoing interdisciplinary research developing AI-based interactive visuals for performance, where dance, ecological science, and real-time systems co-create responsive audiovisual worlds. </figcaption></figure><figure class="mi"><a class="ml" href="/phase-space/"><img src="/img/R2777615695969541167608356010606.webp" width="1920" height="1080" alt="" loading="lazy" decoding="async"></a><figcaption class="caption">“Phase Space” An experimental audiovisual research combining VR, data sonification, and bodily interaction to investigate the porous boundaries between human, non-human, and virtual space. </figcaption></figure><figure class="mi"><a class="ml" href="/wvn/"><img src="/img/A2778819675903474985999211559534.webp" width="2400" height="1800" alt="" loading="lazy" decoding="async"></a><figcaption class="caption">“WVN” A site-specific audiovisual research where sound-driven lasers generate woven light patterns, reactivating the architectural memory of an industrial space. </figcaption></figure><figure class="mi"><a class="ml" href="/pmfc/"><img src="/img/E2777617365824154952018096945774.webp" width="2400" height="1600" alt="" loading="lazy" decoding="async"></a><figcaption class="caption"> <br> “PMFC” An experimental study capturing electrons from photosynthesis and amplifying them through low-energy circuits to power light from living systems.<br> </figcaption></figure><figure class="mi"><a class="ml" href="/superficies-salvatges/"><img src="/img/B2778904769350381202632599796334.webp" width="1024" height="1024" alt="" loading="lazy" decoding="async"></a><figcaption class="caption">“Superfícies Salvatges” An ongoing performative research where a mycelium-based interface converts fungal biodata into responsive audiovisual landscapes, exploring interspecies coexistence. </figcaption></figure><figure class="mi"><a class="ml" href="/live-av/"><img src="/img/B2777611686145441633141992585838.webp" width="1500" height="1000" alt="" loading="lazy" decoding="async"></a><figcaption class="caption">“Live A/V” I create custom modular visual systems in TouchDesigner, performing generative and filmed imagery through audio-reactive processes and live cinema techniques. </figcaption></figure><figure class="mi"><a class="ml" href="/skin-of-soil/"><img src="/img/M2778985226909140767171152312942.webp" width="2400" height="1350" alt="" loading="lazy" decoding="async"></a><figcaption class="caption">“Skin of Soil” An ongoing audiovisual performance research combining live generative visuals, sound, and speculative storytelling to explore regeneration, ecological memory, and language as a living, mutable matter. </figcaption></figure></div></div></div><hr></bodycopy></div></div></div>
